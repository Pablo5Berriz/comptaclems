<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription | ComptaClems</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico" />
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/assets-css/main.css" />
  <link rel="stylesheet" href="/assets-css/auth.css" />

  <script>
    (function(){
      var t=localStorage.getItem('cc_theme');
      if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
        document.documentElement.setAttribute('data-theme','dark');
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body class="auth-page">

  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-grid auth-grid-reverse">

        <!-- ─── Formulaire (gauche sur desktop) ─── -->
        <div class="auth-form">
          <div class="auth-form-inner auth-form-scroll">

            <div class="auth-form-head">
              <div class="auth-form-icon" aria-hidden="true">
                <i class="fas fa-user-plus"></i>
              </div>
              <h2 class="auth-form-title">Créer<br>un compte</h2>
              <p class="auth-form-desc">Rejoignez ComptaClems — quelques secondes suffisent.</p>
            </div>

            <div id="registerAlert" class="auth-alert hidden" role="alert" aria-live="polite"></div>

            <form id="registerForm" class="auth-stack" novalidate>

              <!-- Prénom / Nom -->
              <div class="auth-grid-fields">
                <div class="auth-field">
                  <label for="first_name" class="auth-label">Prénom</label>
                  <div class="auth-input-wrap">
                    <input
                      id="first_name"
                      name="first_name"
                      required
                      placeholder="Marie"
                      class="auth-input"
                      autocomplete="given-name"
                    />
                    <i class="fa-regular fa-user auth-input-icon" aria-hidden="true"></i>
                  </div>
                </div>

                <div class="auth-field">
                  <label for="last_name" class="auth-label">Nom</label>
                  <div class="auth-input-wrap">
                    <input
                      id="last_name"
                      name="last_name"
                      required
                      placeholder="Tremblay"
                      class="auth-input"
                      autocomplete="family-name"
                    />
                    <i class="fa-regular fa-user auth-input-icon" aria-hidden="true"></i>
                  </div>
                </div>
              </div>

              <div class="auth-field">
                <label for="email" class="auth-label">Adresse courriel</label>
                <div class="auth-input-wrap">
                  <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="vous@exemple.com"
                    class="auth-input"
                    autocomplete="email"
                  />
                  <i class="fa-regular fa-envelope auth-input-icon" aria-hidden="true"></i>
                </div>
              </div>

              <div class="auth-field">
                <label for="phone" class="auth-label">Téléphone</label>
                <div class="auth-input-wrap">
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    placeholder="(514) 555-1234"
                    class="auth-input"
                    autocomplete="tel"
                  />
                  <i class="fa-solid fa-phone auth-input-icon" aria-hidden="true"></i>
                </div>
              </div>

              <!-- Mot de passe / Confirmation -->
              <div class="auth-grid-fields">
                <div class="auth-field">
                  <label for="password" class="auth-label">Mot de passe</label>
                  <div class="auth-input-wrap">
                    <input
                      type="password"
                      id="password"
                      name="password"
                      required
                      minlength="8"
                      placeholder="••••••••"
                      class="auth-input"
                      autocomplete="new-password"
                    />
                    <button type="button" class="auth-eye" id="toggleRegPwd" aria-label="Afficher le mot de passe">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="auth-field">
                  <label for="confirm_password" class="auth-label">Confirmation</label>
                  <div class="auth-input-wrap">
                    <input
                      type="password"
                      id="confirm_password"
                      required
                      placeholder="••••••••"
                      class="auth-input"
                      autocomplete="new-password"
                    />
                    <button type="button" class="auth-eye" id="toggleRegConfirm" aria-label="Afficher le mot de passe">
                      <i class="fas fa-eye"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- CGU -->
              <label class="auth-cgu">
                <input type="checkbox" id="cgu" required />
                <span>
                  J'accepte les
                  <a href="/legal/mentions-legales.html">conditions d'utilisation</a>
                  et la
                  <a href="/legal/politique-confidentialite.html">politique de confidentialité</a>.
                </span>
              </label>

              <button type="submit" id="registerSubmit" class="auth-submit">
                <i class="fas fa-user-plus"></i>
                Créer mon compte
              </button>

              <div class="auth-footer">
                <span>Déjà un compte ?</span>
                <a href="/auth/login.html">Se connecter</a>
              </div>

            </form>

          </div>
        </div>

        <!-- ─── Panel droite ─── -->
        <aside class="auth-panel">
          <div class="auth-panel-inner">

            <a href="/index.html" class="auth-logo-link">
              <img src="/assets/logo/Comptaclems.png" alt="ComptaClems" loading="lazy" />
            </a>

            <h1 class="auth-panel-title">Vos impôts,<br>en toute<br>sérénité.</h1>
            <p class="auth-panel-subtitle">
              Soumettez vos déclarations en ligne, suivez l'avancement de vos dossiers et gérez vos documents en toute sécurité.
            </p>

            <a href="/auth/login.html" class="auth-panel-cta">
              Déjà un compte
              <i class="fas fa-arrow-right"></i>
            </a>

          </div>
        </aside>

      </div>
    </section>
  </main>

  <script src="/assets-js/core/http.js" defer></script>
  <script src="/assets-js/global/global.js" defer></script>
  <script src="/assets-js/auth/register.js" defer></script>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      function togglePwd(inputId, btnId){
        var btn = document.getElementById(btnId);
        var inp = document.getElementById(inputId);
        if(!btn||!inp) return;
        btn.addEventListener('click', function(){
          var show = inp.type === 'password';
          inp.type = show ? 'text' : 'password';
          btn.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
          btn.setAttribute('aria-label', show ? 'Masquer' : 'Afficher');
        });
      }
      togglePwd('password',         'toggleRegPwd');
      togglePwd('confirm_password', 'toggleRegConfirm');
    });
  </script>

</body>
</html>
