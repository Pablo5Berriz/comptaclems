<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Documents gouvernementaux — Espace client ComptaClems" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Documents gouvernementaux | ComptaClems — Espace client</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico" />
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/assets-css/main.css" />
  <link rel="stylesheet" href="/assets-css/components.css" />
  <link rel="stylesheet" href="/assets-css/clients/documents.css" />

</head>

<body>

  <!-- Toasts -->
  <div id="toastHost" aria-live="polite" aria-atomic="false"></div>

  <!-- Header global -->
  <script src="/assets-js/global/header.js"></script>

  <main class="page-wrap">

    <!-- ─── En-tête ─── -->
    <div class="page-header">
      <div class="page-header-left">
        <div class="page-header-icon" aria-hidden="true">
          <i class="fas fa-folder-open"></i>
        </div>
        <div>
          <h1 class="page-title">Documents gouvernementaux</h1>
          <p class="page-subtitle">Déposés par votre comptable — Revenu Québec &amp; Revenu Canada</p>
        </div>
      </div>

      <div class="header-actions">
        <a href="/espace-client/documents.html" class="btn btn-outline">
          <i class="fas fa-file-upload"></i>
          Mes documents soumis
        </a>
      </div>
    </div>

    <!-- ─── Stats ─── -->
    <div class="stats-grid" id="statsGrid">

      <div class="stat-card centered">
        <p class="stat-label">Total</p>
        <p class="stat-value" id="statTotal">—</p>
      </div>

      <div class="stat-card centered">
        <p class="stat-label">Actifs</p>
        <p class="stat-value sage" id="statActifs">—</p>
      </div>

      <div class="stat-card centered">
        <p class="stat-label">Téléchargements</p>
        <p class="stat-value navy" id="statDownloads">—</p>
      </div>

      <div class="stat-card centered">
        <p class="stat-label">Années</p>
        <p class="stat-value violet" id="statAnnees">—</p>
      </div>

    </div>

    <!-- ─── Filtres ─── -->
    <div class="filters-panel">
      <div class="filters-row-2">

        <div class="filter-field">
          <label class="field-label" for="filterYear">
            <i class="fas fa-calendar" aria-hidden="true"></i> Année
          </label>
          <div class="filter-select-wrap">
            <select id="filterYear" class="filter-select" aria-label="Filtrer par année">
              <option value="">Toutes les années</option>
            </select>
            <i class="fas fa-chevron-down chevron" aria-hidden="true"></i>
          </div>
        </div>

        <div class="filter-field">
          <label class="field-label" for="filterAuthority">
            <i class="fas fa-building" aria-hidden="true"></i> Autorité
          </label>
          <div class="filter-select-wrap">
            <select id="filterAuthority" class="filter-select" aria-label="Filtrer par autorité">
              <option value="">Toutes</option>
              <option value="REVENU_QUEBEC">Revenu Québec</option>
              <option value="REVENU_CANADA">Revenu Canada</option>
              <option value="BOTH">Les deux</option>
            </select>
            <i class="fas fa-chevron-down chevron" aria-hidden="true"></i>
          </div>
        </div>

        <div class="filter-btns">
          <button id="btnFilter" class="btn btn-navy">
            <i class="fas fa-filter"></i>
            Filtrer
          </button>
          <button id="btnReset" class="btn btn-outline">
            <i class="fas fa-rotate-left"></i>
            Réinitialiser
          </button>
        </div>

      </div>
    </div>

    <!-- ─── Chargement ─── -->
    <div id="loadingState" class="loader-wrap" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p style="font-size:.875rem;color:var(--text-tertiary);">Chargement des documents…</p>
    </div>

    <!-- ─── État vide ─── -->
    <div id="emptyState" class="state-box hidden">
      <div class="state-icon-wrap" aria-hidden="true">
        <i class="fas fa-folder-open"></i>
      </div>
      <p class="state-title">Aucun document disponible</p>
      <p class="state-desc">Votre comptable n'a pas encore déposé de documents gouvernementaux.</p>
    </div>

    <!-- ─── Grille documents (injectée par JS) ─── -->
    <div id="documentsList" class="hidden" aria-live="polite"></div>

  </main>

  <!-- Header global -->
  <script src="/assets-js/global/footer.js"></script>

  <script src="/assets-js/core/http.js" defer></script>
  <script src="/assets-js/global/global.js" defer></script>
  <script src="/assets-js/espace-client/document-gouvernemental.js" defer></script>

</body>
</html>
